<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRON X GENIE - Джинни</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #9d4edd;
            font-size: 24px;
        }

        .status {
            display: flex;
            gap: 15px;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
        }

        .sidebar h3 {
            color: #9d4edd;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-btn {
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid rgba(157, 78, 221, 0.5);
            color: #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 13px;
        }

        .quick-btn:hover {
            background: rgba(157, 78, 221, 0.4);
            transform: translateX(5px);
        }

        .agent-selector {
            margin-bottom: 20px;
        }

        .agent-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .agent-btn.active {
            background: rgba(157, 78, 221, 0.3);
            border-color: #9d4edd;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(157, 78, 221, 0.3);
            border: 1px solid rgba(157, 78, 221, 0.5);
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message .agent-name {
            font-size: 11px;
            color: #9d4edd;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #9d4edd;
        }

        .send-btn {
            background: #9d4edd;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #7b2cbf;
        }

        .send-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            align-self: flex-start;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #9d4edd;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(157, 78, 221, 0.5);
            border-radius: 4px;
        }
    </style>
<style>
    .chat-container { display: flex; flex-direction: column; width: 100%; }
    .msg { margin: 10px 0; padding: 12px; border-radius: 10px; max-width: 75%; word-wrap: break-word; }
    .msg-user { align-self: center; background-color: #333; color: white; text-align: center; border: 1px solid #555; }
    .msg-dron { align-self: flex-start; background-color: #2e7d32; color: white; }
    .msg-genie { align-self: flex-end; background-color: #fbc02d; color: black; }
</style>
</head>

<body>
    <div class="header">
        <h1>🧞 DRON X GENIE</h1>
        <div class="status">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Джинни онлайн</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="agent-selector">
                <h3>Агент</h3>
                <button class="agent-btn active" data-agent="genie">🧞 Джинни</button>
                <button class="agent-btn" data-agent="dron">🤖 Дрон</button>
                <button class="agent-btn" data-agent="both">👥 Оба</button>
            </div>

            <h3>Быстрые действия</h3>
            <div class="quick-actions">
                <button class="quick-btn" onclick="quickAction('Запиши в daily_notes файл idea.md текст: ')">
                    Записать идею
                </button>
                <button class="quick-btn" onclick="quickAction('Запиши в education файл vanya_homework.md текст: ')">
                    📚 Домашка Ване
                </button>
                <button class="quick-btn" onclick="quickAction('Запиши в music файл track_idea.md текст: ')">
                    🎵 Идея для трека
                </button>
                <button class="quick-btn" onclick="quickAction('Запиши в projects файл todo.md текст: ')">
                    ✅ Задача в проект
                </button>
                <button class="quick-btn" onclick="quickAction('Прочитай файл daily_notes/idea.md')">
                    📖 Читать заметку
                </button>
                <button class="quick-btn" onclick="quickAction('Покажи список файлов в daily_notes')">
                    📁 Список файлов
                </button>
            </div>
        </div>

        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="message bot">
                    <div class="agent-name">ДЖИННИ</div>
                    Привет, Босс! Я на связи. Чем могу помочь?
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Напиши сообщение..."
                    onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
    let currentAgent = 'genie';
    let sessionId = 'web_' + Date.now();

    document.querySelectorAll('.agent-btn').forEach(btn=> {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentAgent = this.dataset.agent;
        });
    });

    function quickAction(text) {
        document.getElementById('messageInput').value = text;
        document.getElementById('messageInput').focus();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') { sendMessage(); }
    }

    function addMessage(text, agent, isUser = false) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        
        let agentClass = 'msg-genie';
        if (isUser) agentClass = 'msg-boss';
        else if (agent.toLowerCase() === 'дрон') agentClass = 'msg-dron';

        messageDiv.className = `message ${agentClass}`;

        if (!isUser) {
            const agentName = document.createElement('div');
            agentName.className = 'agent-name';
            agentName.textContent = agent.toUpperCase();
            messageDiv.appendChild(agentName);
        }

        const textNode = document.createElement('div');
        textNode.textContent = text;
        messageDiv.appendChild(textNode);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
        const messagesDiv = document.getElementById('messages');
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typing';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
        const typing = document.getElementById('typing');
        if (typing) typing.remove();
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message) return;

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;

        addMessage(message, 'Босс', true);
        input.value = '';
        showTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, agent: currentAgent, session_id: sessionId })
            });

            hideTyping();
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            
            if (data.responses) {
                data.responses.forEach(resp => addMessage(resp.response, resp.agent));
            } else {
                addMessage(data.response, data.agent);
            }
        } catch (error) {
            hideTyping();
            addMessage(`Ошибка: ${error.message}`, 'СИСТЕМА');
        } finally {
            sendBtn.disabled = false;
        }
    }
</script>
</body>

</html>
