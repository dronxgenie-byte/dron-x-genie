<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DRON — Домашняя панель</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#edf4ff;background:#07111f}
*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(ellipse at top,#142b45,#07111f 65%);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1500px;margin:0 auto 22px}
h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:.08em}h2{margin:0 0 14px;color:#92d8ff}
button,a{font:inherit;color:inherit}button{background:#143455;border:1px solid #3975a1;border-radius:12px;padding:12px 18px;cursor:pointer}
button:hover,a:hover{background:#1b4b70}.actions{display:flex;gap:10px;flex-wrap:wrap}
.grid{max-width:1500px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#101e30eF;border:1px solid #28435e;border-radius:18px;padding:20px;min-height:180px;box-shadow:0 10px 30px #0003}
.wide{grid-column:1/-1}.muted{color:#9db1c8}.list{margin:0;padding-left:22px}.list li{padding:7px 0;border-bottom:1px solid #26394c}
.pills{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#172b40;border-radius:12px;padding:12px 16px;min-width:140px}
.amount{font-size:1.25em;color:#9ae6b4}.status{color:#9ae6b4}.error{color:#ff9d9d}
#voice-result{min-height:1.5em}.toplink{color:#92d8ff;text-decoration:none}
@media(max-width:760px){body{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div><h1>DRON <span style="color:#6fc8ff">×</span> HOME</h1><div id="clock" class="muted">Подключение…</div></div>
  <div class="actions">
    <a class="toplink" href="/static/index.html">Открыть основной интерфейс</a>
    <button id="refresh">Обновить</button>
    <button id="voice">🎙 Голос Дрону</button>
  </div>
</header>
<main class="grid">
  <section class="card"><h2>Задачи · 01_INBOX</h2><div id="tasks" class="muted">Загрузка…</div></section>
  <section class="card"><h2>Расписание · 80_FAMILY</h2><div id="events" class="muted">Загрузка…</div></section>
  <section class="card wide"><h2>Семейная база · anis_bank.db</h2><div id="bank" class="muted">Загрузка…</div></section>
  <section class="card wide"><h2>Архив · 90_ARCHIVE</h2><div id="archive" class="muted">Загрузка…</div></section>
  <section class="card wide"><h2>Голосовой ввод</h2><div id="voice-result" class="muted">Нажмите «Голос Дрону» и разрешите микрофон браузеру.</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub = value => new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB",maximumFractionDigits:2}).format(Number(value)||0);
async function getJSON(url){
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return response.json();
}
function list(items,empty){
  if(!items?.length) return `<p class="muted">${esc(empty)}</p>`;
  return `<ul class="list">${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}
async function refresh(){
  $("clock").textContent="Обновляю данные…";
  try{
    const [d,o]=await Promise.all([getJSON("/api/dashboard"),getJSON("/api/dashboard/overview")]);
    $("clock").textContent=`Обновлено: ${new Date(d.generated_at||Date.now()).toLocaleString("ru-RU")} · ${d.timezone||""}`;
    $("tasks").innerHTML=list((d.tasks||[]).map(t=>t.text),d.sources?.tasks==="ready"?"Открытых задач нет.":"Источник задач недоступен.");
    $("events").innerHTML=list((d.events||[]).map(e=>`${e.date||""} ${e.time||""} — ${e.title||e.body||"Событие"}`),d.sources?.schedule==="ready"?"Событий нет.":"Расписание недоступно.");
    if(o.database_status==="ready"){
      const members=(o.members||[]).map(m=>`<div class="pill">${esc(m.name)}<br><span class="amount">${rub(m.balance)}</span></div>`).join("");
      const treasury=(o.treasury||[]).map(t=>`<div class="pill">Общая казна<br><span class="amount">${rub(t.total_balance)}</span></div>`).join("");
      const tx=(o.transactions||[]).map(t=>`${t.created_at||""} · ${t.description||t.category||t.type||"Операция"} · ${rub(t.amount)}`);
      $("bank").innerHTML=`<div class="pills">${members||'<span class="muted">Участников пока нет.</span>'}${treasury}</div><h3>Последние операции</h3>${list(tx,"Операций пока нет.")}`;
    }else $("bank").innerHTML='<span class="error">База недоступна или не прочитана.</span>';
    $("archive").innerHTML=o.archive_status==="ready"
      ? list((o.archive_entries||[]).map(x=>`${x.kind}: ${x.name}`),"В архиве пока нет записей.")
      : '<span class="error">Архив недоступен.</span>';
  }catch(error){
    $("clock").innerHTML=`<span class="error">Ошибка загрузки: ${esc(error.message)}</span>`;
  }
}
$("refresh").addEventListener("click",refresh);
$("voice").addEventListener("click",()=>{
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition){$("voice-result").textContent="В этом браузере нет распознавания речи. Используйте микрофон в основном интерфейсе.";return;}
  const rec=new Recognition(); rec.lang="ru-RU"; rec.interimResults=false; rec.maxAlternatives=1;
  $("voice-result").textContent="Слушаю…";
  rec.onresult=async event=>{
    const message=event.results[0][0].transcript;
    $("voice-result").textContent=`Распознано: «${message}». Отправляю Дрону…`;
    try{
      const response=await fetch("/api/dron/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:[]})});
      const data=await response.json();
      if(!response.ok) throw new Error(data?.error?.message||response.statusText);
      $("voice-result").textContent=`Вы: ${message} · Дрон: ${data.reply||data.response||"Ответ получен."}`;
    }catch(error){$("voice-result").textContent=`Не удалось отправить запрос: ${error.message}`;}
  };
  rec.onerror=event=>{$("voice-result").textContent=`Ошибка микрофона/распознавания: ${event.error||"неизвестно"}`;};
  rec.start();
});
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
