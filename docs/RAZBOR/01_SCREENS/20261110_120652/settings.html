<!DOCTYPE html><html lang="ru"><head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход в систему</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon" id="favicon">

</head>

<body>

    <div class="login-container">

        <div class="login-header">

            <h2>Вход в систему</h2>

        </div>

        

        
        

        <form method="POST" action="">

            <div class="form-group">

                <label for="login">Логин:</label>

                <input type="text" id="login" name="login" value="" maxlength="100" autocomplete="username" required="" style="">

            </div>

            

            <div class="form-group">

                <label for="password">Пароль:</label>

                <input type="password" id="password" name="password" maxlength="256" autocomplete="current-password" required="" style="">

            </div>

            

            <button type="submit" class="btn">Войти</button>

        </form>

    </div>



</body></html>
